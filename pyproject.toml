[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coursekit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "openai>=2.34.0",
    "pydantic>=2.13.3",
    "pypdf>=6.10.2",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0",
    "rich>=15.0.0",
]

[project.scripts]
coursekit = "coursekit.cli:main"

# The repo root holds non-package dirs (tests/, agent/, prompts/, themes/, app.py), so the wheel
# target is explicit. An *editable* install (uv sync's default) keeps prompts/ and themes/ resolvable
# from the repo root via the loaders' relative paths (coursekit/prompts.py, style.py).
[tool.hatch.build.targets.wheel]
packages = ["coursekit"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
# notebook/prototype.ipynb only: uv sync --group notebook
notebook = [
    "ipykernel>=7.2.0",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
pythonpath = ["."]
